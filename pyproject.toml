[project]
name = "arxiv-research-companion"
version = "0.2.0"
description = "RAG assistant over arXiv abstracts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "streamlit>=1.35.0",   # legacy front-end (streamlit_app.py); remove once Render is live
    "chromadb>=1.0.0",
    "numpy>=1.26",
    "requests>=2.25.1",
    "python-dotenv>=0.19.0",
    "huggingface_hub>=0.24.0",
    "pydantic>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",      # fastapi.testclient
    "gradio>=3.20.0",   # tests/test_interface.py imports the Gradio front-end
]
# Evaluation only (eval/): never installed on the deployed app.
# `uv sync --group eval` ; torch comes in through sentence-transformers.
eval = [
    "ranx",
    "sentence-transformers>=2.2.0",
    "transformers",
    "scipy",
    "ragas",
    "langchain-openai",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: loads real models (needs network on first run); excluded from the default CI job",
    "network: needs internet access",
]
